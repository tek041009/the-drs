name: Bowen Official WBA Direct MP4
on:
  push:
    paths:
      - '.github/workflows/bowen_wba_direct_mp4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download genuine public West Ham MP4 through playManifest redirects
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import urllib.request,json,subprocess,os
          names=[("WBA_GOALS_OFFICIAL", "0_ga7kbzzz"),("WBA_EXTENDED_OFFICIAL","0_388eujhv")]
          report=[]
          for title,vid in names:
            url=f"https://open.http.mp.streamamg.com/p/3000379/sp/300037900/playManifest/entryId/{vid}/format/url/protocol/https"
            target=f"out/{title}.mp4"
            info=dict(title=title,source=url)
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.whufc.com/en/"})
              with urllib.request.urlopen(request,timeout=65) as stream,open(target,"wb") as f:
                info["http_status"]=stream.status
                info["redirected_url"]=stream.url
                info["expected_bytes"]=stream.headers.get("Content-Length")
                while True:
                  chunk=stream.read(1048576)
                  if not chunk:break
                  f.write(chunk)
              info["size"]=os.path.getsize(target)
              p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height,r_frame_rate,codec_name","-of","json",target],capture_output=True,text=True)
              info["probe"]=p.stdout
              info["probe_return_code"]=p.returncode
              if p.returncode!=0 or info["size"]<1000000:raise RuntimeError("Not a valid MP4")
              print(title,"success",info["size"],p.stdout[:600],flush=True)
            except Exception as e:
              info["error"]=str(e)
              print(title,"failed",str(e),flush=True)
            report.append(info)
          with open("out/acquisition_report.json","w") as f:json.dump(report,f,indent=2)
          if not any(x.get("probe_return_code")==0 for x in report):raise SystemExit(1)
          PY
      - name: Publish source files and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bowen-wba-official-direct-mp4
          path: out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
