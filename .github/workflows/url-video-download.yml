name: URL Video Downloader

on:
  push:
    paths:
      - 'video-download/request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read request
        shell: powershell
        run: |
          $url = (Get-Content "video-download/request.txt" -TotalCount 1).Trim()
          if (-not $url) { throw "request.txt has no URL" }
          "VIDEO_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download video
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Remove-Item "output\downloaded-video.*" -Force -ErrorAction SilentlyContinue

          Write-Host "Downloading $env:VIDEO_URL"
          & py -m yt_dlp --no-playlist --merge-output-format mp4 --remux-video mp4 -f "bv*+ba/b" -o "output/downloaded-video.%(ext)s" $env:VIDEO_URL

          if ($LASTEXITCODE -ne 0) {
            Write-Host "yt-dlp failed; trying pytubefix"
            & py video-download/download_fallback.py $env:VIDEO_URL
            if ($LASTEXITCODE -ne 0) { throw "All download methods failed" }
          }

          $candidate = Get-ChildItem output -File | Where-Object { $_.Extension -in ".mp4",".mkv",".webm" } | Select-Object -First 1
          if (-not $candidate) { throw "No downloaded media file found" }

          if ($candidate.Name -ne "downloaded-video.mp4") {
            & ffmpeg -y -i $candidate.FullName -c copy "output\downloaded-video.mp4"
            if ($LASTEXITCODE -ne 0) {
              & ffmpeg -y -i $candidate.FullName -c:v libx264 -c:a aac "output\downloaded-video.mp4"
            }
          }

          & ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "output\downloaded-video.mp4"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded MP4 failed ffprobe validation" }

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: output/downloaded-video.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
