name: URL Video Downloader

on:
  push:
    paths:
      - 'video-download/requests/*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" pytubefix

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(find video-download/requests -maxdepth 1 -type f -name '*.txt' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$REQUEST_FILE"
          URL="$(head -n 1 "$REQUEST_FILE" | tr -d '\r\n')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download video
        shell: bash
        env:
          VIDEO_URL: ${{ steps.request.outputs.url }}
        run: |
          set -uo pipefail
          mkdir -p output

          try_client () {
            CLIENT="$1"
            FORMAT="$2"
            echo "Trying YouTube client: $CLIENT"
            rm -f output/downloaded.*
            yt-dlp --no-playlist --js-runtimes node               --extractor-args "youtube:player_client=$CLIENT"               --merge-output-format mp4 --remux-video mp4               -f "$FORMAT"               -o "output/downloaded.%(ext)s"               "$VIDEO_URL"
          }

          OK=0
          try_client "android_vr" "bv*+ba/b" && OK=1
          if [ "$OK" -eq 0 ]; then try_client "web_embedded" "bv*+ba/b" && OK=1; fi
          if [ "$OK" -eq 0 ]; then try_client "tv" "bv*+ba/b" && OK=1; fi
          if [ "$OK" -eq 0 ]; then try_client "web_safari" "b[ext=mp4]/b" && OK=1; fi
          if [ "$OK" -eq 0 ]; then
            echo "yt-dlp clients failed; trying pytubefix"
            rm -f output/downloaded.*
            python video-download/download_fallback.py "$VIDEO_URL" && OK=1
          fi
          if [ "$OK" -eq 0 ]; then
            echo "All download strategies failed"
            exit 1
          fi

          FILE="$(find output -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mkv' -o -name '*.webm' \) | head -n 1)"
          test -n "$FILE"
          if [ "$FILE" != "output/downloaded.mp4" ]; then
            ffmpeg -y -i "$FILE" -c copy output/downloaded.mp4 || ffmpeg -y -i "$FILE" -c:v libx264 -c:a aac output/downloaded.mp4
          fi
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/downloaded.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: output/downloaded.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
