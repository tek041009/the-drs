name: Rarely Told V5 Current-Gen Opening
on:
  push:
    branches: [rarely-told-v5-ltx25]
    paths:
      - 'v7_trigger.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-v5-ltx25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free automation stack
        run: |
          pip install gradio_client kokoro-onnx soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate all eight current-generation animated shots and assemble opening
        run: python build_rarely_told_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: rarely-told-ai-first-30s-v5
          path: |
            Rarely_Told_AI_First_30s_V5.mp4
            victor_ref.jpg
          retention-days: 7
