name: Temporary Bowen Portsmouth Shot Footage Visual Audit
on:
  push:
    branches: [tmp-bowen-portsmouth-clip-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download official goal takes, extract full action and replays
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --user -q -U yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          export PATH="$HOME/.local/bin:$PATH"
          docker run -d --name bowen-warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 10
          mkdir -p audit
          while IFS='|' read -r vid start dur name; do
            [ -z "$vid" ] && continue
            yt-dlp --proxy socks5://127.0.0.1:1080 --force-ipv4 --js-runtimes node --remote-components ejs:github --extractor-args "youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage" --retries 3 --fragment-retries 3 --socket-timeout 30 --no-playlist -f "bestvideo*[height<=1080]+bestaudio/best[height<=1080]/18" --merge-output-format mp4 -o "/tmp/$vid.%(ext)s" "https://www.youtube.com/watch?v=$vid" || { echo "$vid FAILED" >>audit/manifest.txt; continue; }
            src=$(find /tmp -maxdepth 1 -name "$vid.*" -type f | head -n 1)
            ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate -of json "$src" >"audit/$name-metadata.json"
            if [ "$start" = "0" ]; then
              ffmpeg -y -hide_banner -loglevel error -i "$src" -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 112k "audit/$name.mp4"
            else
              ffmpeg -y -hide_banner -loglevel error -ss "$start" -i "$src" -t "$dur" -c:v libx264 -preset fast -crf 19 -c:a aac -b:a 128k "audit/$name.mp4"
            fi
            echo "$name URL=https://youtube.com/watch?v=$vid source_trim=$start-$dur" >>audit/manifest.txt
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of default=noprint_wrappers=1 "audit/$name.mp4" >>audit/manifest.txt
            ffmpeg -y -hide_banner -loglevel error -i "audit/$name.mp4" -vf "fps=4,scale=320:-2" -q:v 3 "audit/$name-frame-%04d.jpg" || true
          done <<'SOURCES'
          R15cQiru4-U|59|34|WHU_SHORT_BOWEN
          ILZR4ngvWfE|267|56|EFL_EXT_BOWEN
          B5_vpCdI57E|148|44|WHU_EXT_BOWEN
          7oEhDOc7GXE|0|0|EFL_SHORT_FULL
          Syig5LWe0d4|0|0|SCTV_FULL
          SOURCES
      - name: Upload source video audition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portsmouth-goal-video-footage-audition
          path: audit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
