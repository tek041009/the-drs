name: Relay Bridge Test

on:
  push:
    paths:
      - 'video-download/relay-test-trigger.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Make test file
        run: |
          mkdir -p output
          printf 'relay bridge works\n' > output/relay-test.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-test
          path: output/relay-test.txt
          compression-level: 0
          retention-days: 1
