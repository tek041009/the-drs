name: Bowen Bent context
on:
  push:
    paths:
      - ".github/workflows/bowen_bent_context.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Tools
        run: |
          python -m pip install -q --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          docker run -d --name warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 8
      - name: Pull contextual Bowen line
        run: |
          set -e
          mkdir -p out
          yt-dlp --proxy socks5://127.0.0.1:1080 --force-ipv4 --rm-cache-dir --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage' \
            --download-sections '*576-590' --force-keyframes-at-cuts \
            -f 'bestvideo*[height<=720]+bestaudio/best[height<=720]/18' --merge-output-format mp4 \
            -o out/BENT_BOWEN_CONTEXT.mp4 'https://www.youtube.com/watch?v=zSjDwM2nmUM'
          ffmpeg -v error -i out/BENT_BOWEN_CONTEXT.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: bowen-bent-context
          path: out/
          retention-days: 2
