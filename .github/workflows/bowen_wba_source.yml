name: Bowen WBA Source Acquisition
on:
  push:
    paths:
      - '.github/workflows/bowen_wba_source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          python -m pip install --upgrade 'yt-dlp[default]' yt-dlp-ejs
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start WARP network route
        run: |
          docker run -d --name bowen-warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 10
          docker ps
      - name: Discover official page stream configuration
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json
          from pathlib import Path
          Path("out").mkdir(exist_ok=True)
          pages=[
           "https://www.whufc.com/en/news/goals-or-west-ham-united-1-3-west-bromwich-albion",
           "https://www.whufc.com/en/video/0_ga7kbzzz?provider=stream",
           "https://www.whufc.com/en/news/extended-highlights-or-west-ham-united-1-3-west-bromwich-albion"
          ]
          output=[]
          for u in pages:
            try:
              r=requests.get(u,timeout=20,headers={"User-Agent":"Mozilla/5.0"})
              t=r.text
              info=dict(url=u,status=r.status_code,length=len(t),title=re.findall(r"<title[^>]*>(.*?)</title>",t,re.I|re.S)[:2],
                  stream_mentions=[])
              for match in list(re.finditer(r"kaltura|partner.?id|playmanifest|m3u8|0_ga7kbzzz|0_388eujhv|streamurl|sourceurl|videoUrl|iframe|videoSource",t,re.I))[:80]:
                info['stream_mentions'].append(t[max(0,match.start()-180):match.end()+220])
              info['manifest_urls']=list(set(re.findall(r'https?[^"\\\s]+(?:m3u8|mp4)[^"\\\s]*',t,re.I)))[:30]
              output.append(info)
            except Exception as e: output.append(dict(url=u,error=str(e)))
          Path("out/discovery.json").write_text(json.dumps(output,indent=2))
          print([(o['url'],o.get('status'),o.get('length'),len(o.get('stream_mentions',[]))) for o in output])
          PY
      - name: Acquire official West Ham / EFL goal footage
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          cat > /tmp/wba.py <<'PY'
          import subprocess, os, glob, json, pathlib
          candidates=[
            ("whu_youtube_short","ytsearch1:West Ham 1-3 West Brom Championship Extended Highlights West Ham United FC"),
            ("efl_youtube_warp","https://www.youtube.com/watch?v=5vjR6LtkW88"),
            ("whu_youtube_warp","https://www.youtube.com/watch?v=dQ6uC7sQVJ4"),
            ("whu_goals","https://www.whufc.com/en/video/0_ga7kbzzz?provider=stream"),
            ("whu_goals_article","https://www.whufc.com/en/news/goals-or-west-ham-united-1-3-west-bromwich-albion"),
            ("whu_extended","https://www.whufc.com/en/video/0_388eujhv?provider=stream"),
            ("efl_youtube","ytsearch1:HAMMER BLOW! | West Ham v West Brom extended highlights EFL 2026"),
            ("whu_youtube","ytsearch1:West Ham 1-3 West Brom Championship Extended Highlights West Ham United FC"),
          ]
          logs=[]
          success=False
          for name,url in candidates:
            target="out/"+name+".%(ext)s"
            cmd=["yt-dlp","--no-playlist","--no-warnings","--socket-timeout","20",
                 "--proxy","socks5://127.0.0.1:1080","--force-ipv4","--rm-cache-dir",
                 "--extractor-args","youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage",
                 "--retries","2","--fragment-retries","2","--js-runtimes","node",
                 "--remote-components","ejs:github","-f","bv*[height<=1080]+ba/b[height<=1080]/b",
                 "--merge-output-format","mp4","-o",target,url]
            if name=="whu_youtube_short":
              cmd[1:1]=["--download-sections","*00:03:35-00:06:45","--force-keyframes-at-cuts"]
            try:
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=300)
              logs.append(dict(candidate=name,url=url,code=p.returncode,stdout=p.stdout[-5000:],stderr=p.stderr[-5000:]))
              print(name, p.returncode, p.stdout[-1000:],p.stderr[-1000:],flush=True)
            except Exception as e:
              logs.append(dict(candidate=name,url=url,error=str(e)))
            files=[pathlib.Path(p) for p in glob.glob("out/"+name+".*") if p.endswith((".mp4",".mkv",".webm"))]
            if files:
              file=files[0]
              probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size:stream=width,height,r_frame_rate","-of","json",str(file)],capture_output=True,text=True)
              logs[-1]["file"]=str(file)
              logs[-1]["probe"]=probe.stdout
              if probe.returncode==0 and file.stat().st_size>500000:
                success=True
                break
          pathlib.Path("out/acquisition_report.json").write_text(json.dumps(logs,indent=2))
          print("SUCCESS",success,flush=True)
          if not success: raise SystemExit(1)
          PY
          python /tmp/wba.py
      - name: Upload footage and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bowen-west-brom-official-source
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
