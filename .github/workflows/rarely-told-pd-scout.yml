name: Rarely Told PD Source Scout
on:
  push:
    branches: [rarely-told-short-pd-v1]
    paths:
      - '.github/workflows/rarely-told-pd-scout.yml'
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-short-pd-v1
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download public-domain Paris footage and stills
        run: |
          mkdir -p sources
          curl -L --fail --retry 3 -o sources/seeing_paris_1.mp4 "https://ia700400.us.archive.org/23/items/6113_Seeing_Paris_Part_One_On_the_Boulevards_00_00_59_05/6113_Seeing_Paris_Part_One_On_the_Boulevards_00_00_59_05.mp4"
          curl -L --fail --retry 3 -o sources/seeing_paris_4.mp4 "https://ia802606.us.archive.org/23/items/6113_Seeing_Paris_Part_Four_Up_and_Around_The_Eiffel_Tower_00_13_06_01/6113_Seeing_Paris_Part_Four_Up_and_Around_The_Eiffel_Tower_00_13_06_01.mp4"
          curl -L --fail --retry 3 -o sources/victor_mugshot.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Victor%20Lustig%20Mugshot.jpeg"
          curl -L --fail --retry 3 -o sources/victor_id.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Victor%20Lustig%20DOJ%20BOI%20(FBI)%20identification,%201931.jpg"
          curl -L --fail --retry 3 -o sources/paris_traffic.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Place%20de%20l%27Op%C3%A9ra,%201920s%20Paris%20traffic.jpg"
          curl -L --fail --retry 3 -o sources/eiffel_1925.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tour%20Eiffel%20publicit%C3%A9%20Citro%C3%ABn%201925.jpg"
          curl -L --fail --retry 3 -o sources/crillon.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/L%27h%C3%B4tel%20de%20Crillon,%20place%20de%20la%20Concorde%20-%20A13877.jpg"
      - name: Build source contact sheets
        run: |
          ffmpeg -y -loglevel error -i sources/seeing_paris_1.mp4 -vf "fps=1/30,scale=320:-2,tile=4x4" -frames:v 1 sources/contact_part1.jpg
          ffmpeg -y -loglevel error -i sources/seeing_paris_4.mp4 -vf "fps=1/12,scale=320:-2,tile=4x5" -frames:v 1 sources/contact_part4.jpg
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 sources/seeing_paris_1.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 sources/seeing_paris_4.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: rarely-told-pd-source-scout
          path: sources
          retention-days: 7
