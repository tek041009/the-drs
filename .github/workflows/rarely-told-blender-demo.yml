name: Rarely Told Animated Demo
on:
  push:
    branches: [rarely-told-blender-demo]
    paths:
      - '.github/workflows/rarely-told-blender-demo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-blender-demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install free open-source stack
        run: |
          pip install kokoro-onnx soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg blender
      - name: Generate free narrator and soundtrack
        run: python rarely_told_audio.py
      - name: Render genuine 3D animation
        run: blender --background --python rarely_told_blender.py
      - name: Build 30-second opening
        run: |
          ffmpeg -y -loglevel error -i rarely_told_silent.mp4 -i mix.wav -t 30             -vf "scale=1280:720:flags=lanczos" -c:v libx264 -preset fast -crf 18             -c:a aac -b:a 192k -movflags +faststart Rarely_Told_Animated_First_30s.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 Rarely_Told_Animated_First_30s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: rarely-told-animated-first-30s
          path: Rarely_Told_Animated_First_30s.mp4
          retention-days: 7
