name: Bowen Contact Prepare

on:
  push:
    paths:
      - 'video-download/cloud-proxy-test.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make compact visual payload
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
from PIL import Image
import base64
src="video-download/review/bowen-contact.jpg"
img=Image.open(src).convert("RGB")
img=img.resize((1929,817))
out="video-download/review/bowen-contact-small.jpg"
img.save(out,"JPEG",quality=62,optimize=True)
with open(out,"rb") as f:
    payload=base64.b64encode(f.read()).decode("ascii")
with open("video-download/review/bowen-contact-small.b64","w",encoding="utf-8") as f:
    f.write(payload)
print("jpeg_bytes", __import__("os").path.getsize(out))
print("base64_chars", len(payload))
PY

      - name: Commit compact contact sheet
        shell: bash
        run: |
          git config user.name "ChatGPT Video Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add video-download/review/bowen-contact-small.jpg video-download/review/bowen-contact-small.b64
          git commit -m "Add compact Bowen contact sheet payload" || exit 0
          git push
