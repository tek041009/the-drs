name: Cloud Media API Test

on:
  push:
    paths:
      - 'video-download/cloud-proxy-test.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Cobalt live instances
        shell: bash
        run: |
          set -e
          echo "Fetching instance directory"
          curl -k -A "Mozilla/5.0" -fsSL --connect-timeout 10 --max-time 30 "https://instances.cobalt.best/api/instances.json" -o /tmp/instances.json
          wc -c /tmp/instances.json
          head -c 20000 /tmp/instances.json
