name: Bowen Contact Prepare

on:
  push:
    paths:
      - 'video-download/cloud-proxy-test.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Make compact visual payload
        shell: bash
        run: |
          python3 -c 'from PIL import Image; import base64,os; src="video-download/review/bowen-contact.jpg"; out="video-download/review/bowen-contact-small.jpg"; b64="video-download/review/bowen-contact-small.b64"; img=Image.open(src).convert("RGB").resize((1929,817)); img.save(out,"JPEG",quality=55,optimize=True); payload=base64.b64encode(open(out,"rb").read()).decode("ascii"); open(b64,"w",encoding="utf-8").write(payload); print(os.path.getsize(out),len(payload))'

      - name: Commit compact contact sheet
        shell: bash
        run: |
          git config user.name "ChatGPT Video Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add video-download/review/bowen-contact-small.jpg video-download/review/bowen-contact-small.b64
          git commit -m "Add compact Bowen contact sheet payload" || exit 0
          git push
