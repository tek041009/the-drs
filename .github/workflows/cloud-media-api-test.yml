name: Bowen Goal Locate

on:
  push:
    paths:
      - 'video-download/cloud-proxy-test.txt'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download full highlights through loader.to
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output video-download/review
          QUERY=$(python3 -c 'import urllib.parse; print(urllib.parse.urlencode({"url":"https://www.youtube.com/watch?v=mRif6sq9gBI","add_info":"1","format":"1080"}))')
          GOT=0
          for IP in 172.67.198.191 104.21.95.172; do
            CODE=$(curl --resolve "loader.to:443:$IP" -A "Mozilla/5.0" -sS -o /tmp/info.json -w "%{http_code}" --connect-timeout 10 --max-time 45 "https://loader.to/api/download?$QUERY" || true)
            if [ "$CODE" = "200" ]; then GOT=1; break; fi
          done
          test "$GOT" -eq 1
          ID=$(jq -r '.id // empty' /tmp/info.json)
          PROGRESS=$(jq -r '.progress_url // empty' /tmp/info.json)
          if [ -z "$PROGRESS" ]; then PROGRESS="https://p.savenow.to/api/progress?id=$ID"; fi
          DL=""
          for N in $(seq 1 150); do
            curl -A "Mozilla/5.0" -sS --connect-timeout 10 --max-time 30 "$PROGRESS" -o /tmp/progress.json || true
            SUCCESS=$(jq -r '.success // 0' /tmp/progress.json 2>/dev/null || echo 0)
            DL=$(jq -r '.download_url // .download // empty' /tmp/progress.json 2>/dev/null || true)
            if [ "$SUCCESS" = "1" ] && [ -n "$DL" ]; then break; fi
            sleep 2
          done
          test -n "$DL"
          curl -A "Mozilla/5.0" -fL --retry 2 --connect-timeout 15 --max-time 600 "$DL" -o output/full.mp4

      - name: Create timestamped contact sheet
        shell: bash
        run: |
          ffmpeg -y -i output/full.mp4 -vf "trim=start=450:end=684,setpts=PTS-STARTPTS+450/TB,fps=1/5,scale=480:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='%{pts\\:hms}':x=12:y=12:fontsize=28:fontcolor=white:box=1:boxcolor=black@0.75,tile=8x6:padding=2:margin=2" -frames:v 1 -q:v 3 video-download/review/bowen-contact.jpg
          file video-download/review/bowen-contact.jpg
          ls -lh video-download/review/bowen-contact.jpg

      - name: Commit contact sheet
        shell: bash
        run: |
          git config user.name "ChatGPT Video Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add video-download/review/bowen-contact.jpg
          git commit -m "Add Bowen goal contact sheet" || exit 0
          git push
