name: Rarely Told Voice Free
on:
  push:
    branches: [rarely-told-free-voice]
    paths:
      - '.github/workflows/rarely-told-free-voice.yml'
  workflow_dispatch:
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-free-voice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          pip install kokoro-onnx soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python rarely_told_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: rarely-told-free-voice
          path: rarely_told_voice.wav
          retention-days: 7
