name: Probe non-Zero current video spaces
on:
  push:
    branches: [rarely-told-v5-ltx25]
    paths:
      - '.github/workflows/probe-current-spaces.yml'
      - 'probe_current_spaces.py'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-v5-ltx25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gradio_client
      - run: python probe_current_spaces.py
