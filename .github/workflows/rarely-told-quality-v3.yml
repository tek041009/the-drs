name: Rarely Told Quality Demo V3
on:
  push:
    branches: [rarely-told-quality-v3]
    paths:
      - '.github/workflows/rarely-told-quality-v3.yml'
      - 'rarely_told_quality_blender.py'
      - 'rarely_told_quality_audio.py'
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-quality-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install free voice stack
        run: |
          pip install kokoro-onnx soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate narrator and sound design
        run: python rarely_told_quality_audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: rare-audio
          path: mix.wav
          retention-days: 7

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        chunk: [A, B, C]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rarely-told-quality-v3

      - name: Fetch only required CC0 Kenney assets
        uses: actions/checkout@v4
        with:
          repository: series-ai/jam-ready-assets
          path: assets
          lfs: true
          fetch-depth: 1
          sparse-checkout: |
            kenney-animated-characters-protagonists/3D/characters
            kenney-city-kit-commercial/3D/city/Models/GLB format
            kenney-city-kit-roads/3D/city/Models/GLB format
            kenney-furniture-kit/3D/interior-furniture/Models/GLTF format
          sparse-checkout-cone-mode: false

      - name: Install free 3D render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb libegl1 libgl1-mesa-dri libglx-mesa0 git-lfs python3-numpy
          cd assets
          git lfs pull || true

      - name: Render animated scene chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          xvfb-run -a blender --background --python rarely_told_quality_blender.py
          test -s "chunk_${CHUNK}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: rare-chunk-${{ matrix.chunk }}
          path: chunk_${{ matrix.chunk }}.mp4
          retention-days: 7

  finish:
    needs: [audio, render]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Get soundtrack
        uses: actions/download-artifact@v4
        with:
          name: rare-audio
          path: audio

      - name: Get animated chunks
        uses: actions/download-artifact@v4
        with:
          pattern: rare-chunk-*
          path: chunks
          merge-multiple: true

      - name: Assemble and polish first 30 seconds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          printf "file '%s/chunk_A.mp4'\nfile '%s/chunk_B.mp4'\nfile '%s/chunk_C.mp4'\n" "$PWD/chunks" "$PWD/chunks" "$PWD/chunks" > list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy visual.mp4
          ffmpeg -y -loglevel error -i visual.mp4 -i audio/mix.wav -t 30 \
            -vf "minterpolate=fps=24:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1,scale=1280:720:flags=lanczos,unsharp=5:5:0.28:5:5:0.0" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart Rarely_Told_Quality_First_30s_V3.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 Rarely_Told_Quality_First_30s_V3.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rarely-told-quality-first-30s-v3
          path: Rarely_Told_Quality_First_30s_V3.mp4
          retention-days: 7
