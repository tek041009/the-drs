name: Check HF token presence
on:
  push:
    branches: [rarely-told-v5-ltx25]
    paths:
      - '.github/workflows/check-hf-secret.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token presence without revealing it
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: \${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "HF_TOKEN_PRESENT=true"; else echo "HF_TOKEN_PRESENT=false"; fi
          if [ -n "$HUGGINGFACE_TOKEN" ]; then echo "HUGGINGFACE_TOKEN_PRESENT=true"; else echo "HUGGINGFACE_TOKEN_PRESENT=false"; fi
