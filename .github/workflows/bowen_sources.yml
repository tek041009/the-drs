name: Bowen source clips

on:
  push:
    paths:
      - ".github/workflows/bowen_sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Resolve public streams, locate quotes, cut clips
        shell: bash
        run: |
          mkdir -p out
          cat > /tmp/acquire.py <<'PY'
          import os, re, json, html, difflib, subprocess, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path

          APIS = [
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.leptons.xyz",
            "https://pipedapi.nosebs.ru",
            "https://piped-api.privacy.com.de",
            "https://pipedapi.adminforge.de",
            "https://api.piped.yt",
            "https://pipedapi.drgns.space",
            "https://pipedapi.owo.si",
            "https://piped-api.codespace.cz",
            "https://pipedapi.reallyaweso.me",
            "https://api.piped.private.coffee",
            "https://pipedapi.darkness.services",
            "https://pipedapi.orangenet.cc"
          ]

          items = [
            ("01_WEST_HAM_WAY_NOT_CONFIDENT","4fg9pR3i3Vg","I'm not confident that Jarrod Bowen stays"),
            ("02_TONY_GALE_CHAMPIONSHIP","ycmfKTfv6O4","West Ham will be able to persuade him to play for them in the Championship"),
            ("03_DARREN_BENT_CHAMPIONS_LEAGUE","zSjDwM2nmUM","Champions League football pretty much week in week out"),
            ("04_STELLING_PARLOUR_WHAT_AM_I_DOING","AYB1oR60h0U","Jarrod's got to be looking at that league table and thinking what am I doing"),
            ("05_HAMMERS_CHAT_ATTRACTIVE","TBQDPInEbEY","Would Jarrod Bowen want to go yeah I can understand that being attractive to him"),
            ("06_JAMES_CORDEN_ABSOLUTELY_SHOULD_GO","xBCcQBX9OJ0","if Liverpool come in for him or Man United come in for him he absolutely should go"),
          ]

          def get(url, timeout=25):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(), r.headers.get("content-type","")

          def norm(s):
              s=html.unescape(s)
              s=re.sub(r"<[^>]+>"," ",s)
              for a,b in [("Jared","Jarrod"),("Gerard","Jarrod"),("Jarrad","Jarrod"),("Jared's","Jarrod's")]:
                  s=s.replace(a,b)
              s=s.lower().replace("'","")
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return re.sub(r"\s+"," ",s).strip()

          def parse_time(s):
              s=s.strip().replace(",",".")
              if s.endswith("s") and ":" not in s:
                  return float(s[:-1])
              parts=s.split(":")
              if len(parts)==3: return int(parts[0])*3600+int(parts[1])*60+float(parts[2])
              if len(parts)==2: return int(parts[0])*60+float(parts[1])
              return float(s)

          def parse_subs(data, ctype):
              txt=data.decode("utf-8","ignore")
              cues=[]
              if "vtt" in ctype.lower() or txt.lstrip().startswith("WEBVTT"):
                  lines=txt.splitlines(); i=0
                  while i<len(lines):
                      if "-->" in lines[i]:
                          m=re.match(r"\s*([0-9:.,]+)\s*-->\s*([0-9:.,]+)",lines[i])
                          if m:
                              st,en=parse_time(m.group(1)),parse_time(m.group(2)); i+=1; body=[]
                              while i<len(lines) and lines[i].strip():
                                  body.append(lines[i].strip()); i+=1
                              t=norm(" ".join(body))
                              if t: cues.append((st,en,t))
                      i+=1
              else:
                  # TTML/XML timed text
                  root=ET.fromstring(txt)
                  for el in root.iter():
                      if el.tag.endswith("p"):
                          b=el.attrib.get("begin"); e=el.attrib.get("end")
                          if b and e:
                              t=norm(" ".join(el.itertext()))
                              if t: cues.append((parse_time(b),parse_time(e),t))
              # rolling captions duplicate heavily; remove exact consecutive dupes
              clean=[]; prev=None
              for c in cues:
                  if c[2]!=prev:
                      clean.append(c); prev=c[2]
              return clean

          def best(cues,target):
              nt=norm(target); target_words=set(nt.split()); best=None
              for i in range(len(cues)):
                  joined=""
                  for j in range(i,min(len(cues),i+12)):
                      joined=(joined+" "+cues[j][2]).strip()
                      jw=set(joined.split())
                      overlap=len(target_words & jw)/max(1,len(target_words))
                      seq=difflib.SequenceMatcher(None,nt,joined).ratio()
                      score=.58*seq+.42*overlap
                      cand=(score,cues[i][0],cues[j][1],joined)
                      if best is None or score>best[0]: best=cand
              return best

          def resolve(video_id):
              errors=[]
              for api in APIS:
                  try:
                      raw,_=get(api+"/streams/"+video_id)
                      d=json.loads(raw)
                      if d.get("videoStreams") and d.get("subtitles") is not None:
                          return api,d
                  except Exception as e:
                      errors.append(api+":"+str(e))
              raise RuntimeError("No Piped instance resolved "+video_id+" :: "+" | ".join(errors[-5:]))

          def choose_streams(d):
              vids=d.get("videoStreams") or []
              auds=d.get("audioStreams") or []
              # Prefer H264/MPEG4 and <=720p.
              ok=[v for v in vids if int(v.get("height") or 0)<=720 and int(v.get("height") or 0)>0]
              if not ok: ok=vids[:]
              prog=[v for v in ok if not v.get("videoOnly",False)]
              key=lambda v:(int(v.get("height") or 0), "avc" in str(v.get("codec","")).lower() or "h264" in str(v.get("codec","")).lower())
              if prog:
                  return max(prog,key=key),None
              v=max(ok,key=key)
              if not auds: return v,None
              a=max(auds,key=lambda x:int(x.get("bitrate") or 0))
              return v,a

          def run(cmd):
              print("+"," ".join(cmd),flush=True)
              p=subprocess.run(cmd,text=True,capture_output=True)
              print(p.stdout)
              print(p.stderr)
              if p.returncode: raise RuntimeError("command failed")
              return p

          manifest=[]
          for name,vid,target in items:
              api,d=resolve(vid)
              print("RESOLVED",name,"via",api,"title",d.get("title"),flush=True)
              subs=[s for s in (d.get("subtitles") or []) if str(s.get("code","")).lower().startswith("en")]
              if not subs: raise RuntimeError("No English subtitles for "+name)
              # Prefer generated English if that's what's available; either is fine for timing.
              sub=subs[0]
              subdata,ctype=get(sub["url"])
              cues=parse_subs(subdata,ctype or sub.get("mimeType",""))
              m=best(cues,target)
              if not m or m[0]<.27: raise RuntimeError("Low subtitle match "+name+" "+repr(m))
              score,qs,qe,matched=m
              cs=max(0,qs-2.0); ce=qe+2.0; dur=ce-cs
              v,a=choose_streams(d)
              out=f"out/{name}.mp4"
              if a is None:
                  run(["ffmpeg","-y","-ss",f"{cs:.3f}","-i",v["url"],"-t",f"{dur:.3f}",
                       "-c:v","libx264","-preset","veryfast","-crf","17","-c:a","aac","-b:a","192k",
                       "-movflags","+faststart",out])
              else:
                  run(["ffmpeg","-y","-ss",f"{cs:.3f}","-i",v["url"],"-ss",f"{cs:.3f}","-i",a["url"],"-t",f"{dur:.3f}",
                       "-map","0:v:0","-map","1:a:0","-c:v","libx264","-preset","veryfast","-crf","17",
                       "-c:a","aac","-b:a","192k","-movflags","+faststart",out])
              run(["ffmpeg","-v","error","-i",out,"-f","null","-"])
              probe=run(["ffprobe","-v","error","-show_entries","format=duration:stream=width,height,r_frame_rate","-of","default=nw=1",out]).stdout
              Path(f"out/{name}.txt").write_text(
                  f"piped_api={api}\nsource=https://www.youtube.com/watch?v={vid}\nmatch_score={score:.3f}\nquote_start={qs:.3f}\nquote_end={qe:.3f}\nclip_start={cs:.3f}\nclip_end={ce:.3f}\nmatched_text={matched}\n{probe}"
              )
              # 3-frame visual audit strip
              run(["ffmpeg","-y","-i",out,"-vf","select='eq(n,5)+eq(n,round(N/2))+eq(n,N-6)',scale=480:-1,tile=3x1","-vsync","vfr","-frames:v","1",f"out/{name}_audit.jpg"])
              manifest.append(dict(name=name,id=vid,source=f"https://www.youtube.com/watch?v={vid}",api=api,
                                   match_score=score,quote_start=qs,quote_end=qe,clip_start=cs,clip_end=ce,matched_text=matched,
                                   stream_quality=v.get("quality"),stream_height=v.get("height")))
          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          python /tmp/acquire.py

      - name: Upload Bowen source bank
        uses: actions/upload-artifact@v4
        with:
          name: bowen-media-chatter-six
          path: out/
          if-no-files-found: error
          retention-days: 3
