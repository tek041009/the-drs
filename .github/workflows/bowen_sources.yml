name: Bowen source clips

on:
  push:
    paths:
      - ".github/workflows/bowen_sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install free source tools and WARP route
        run: |
          python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker run -d --name bowen-warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 12
          docker ps
          node --version
          yt-dlp --version

      - name: Acquire six exact source clips
        shell: bash
        run: |
          mkdir -p out work
          cat > /tmp/acquire.py <<'PY'
          import os,re,glob,html,difflib,subprocess,json
          from pathlib import Path

          items=[
           ("01_WEST_HAM_WAY_NOT_CONFIDENT","4fg9pR3i3Vg","I'm not confident that Jarrod Bowen stays"),
           ("02_TONY_GALE_CHAMPIONSHIP","ycmfKTfv6O4","West Ham will be able to persuade him to play for them in the Championship"),
           ("03_DARREN_BENT_CHAMPIONS_LEAGUE","zSjDwM2nmUM","Champions League football pretty much week in week out"),
           ("04_STELLING_PARLOUR_WHAT_AM_I_DOING","AYB1oR60h0U","Jarrod's got to be looking at that league table and thinking what am I doing"),
           ("05_HAMMERS_CHAT_ATTRACTIVE","TBQDPInEbEY","Would Jarrod Bowen want to go yeah I can understand that being attractive to him"),
           ("06_JAMES_CORDEN_ABSOLUTELY_SHOULD_GO","xBCcQBX9OJ0","if Liverpool come in for him or Man United come in for him he absolutely should go"),
          ]

          COMMON=[
            "--proxy","socks5://127.0.0.1:1080",
            "--force-ipv4","--rm-cache-dir",
            "--js-runtimes","node",
            "--remote-components","ejs:github",
            "--extractor-args","youtube:player_client=tv,web_safari;player_skip=webpage",
            "--retries","3","--fragment-retries","3","--socket-timeout","30"
          ]

          def run(cmd,check=True):
            print("+"," ".join(cmd),flush=True)
            p=subprocess.run(cmd,text=True,capture_output=True)
            print(p.stdout); print(p.stderr)
            if check and p.returncode: raise RuntimeError("command failed")
            return p

          def sec(ts):
            p=ts.replace(",",".").split(":")
            if len(p)==3:return int(p[0])*3600+int(p[1])*60+float(p[2])
            return int(p[0])*60+float(p[1])

          def norm(s):
            s=html.unescape(re.sub(r"<[^>]+>"," ",s))
            for a in ("Jared","Gerard","Jarrad"): s=s.replace(a,"Jarrod")
            s=s.lower().replace("'","")
            return re.sub(r"\s+"," ",re.sub(r"[^a-z0-9]+"," ",s)).strip()

          def parse_vtt(path):
            lines=Path(path).read_text(errors="ignore").splitlines(); cues=[]; i=0
            while i<len(lines):
              if "-->" in lines[i]:
                m=re.match(r"\s*([0-9:.,]+)\s*-->\s*([0-9:.,]+)",lines[i])
                if m:
                  st,en=sec(m.group(1)),sec(m.group(2)); i+=1; body=[]
                  while i<len(lines) and lines[i].strip():
                    body.append(lines[i].strip()); i+=1
                  t=norm(" ".join(body))
                  if t:cues.append((st,en,t))
              i+=1
            clean=[];prev=None
            for c in cues:
              if c[2]!=prev:clean.append(c);prev=c[2]
            return clean

          def best(cues,target):
            nt=norm(target); tw=set(nt.split()); b=None
            for i in range(len(cues)):
              s=""
              for j in range(i,min(i+12,len(cues))):
                s=(s+" "+cues[j][2]).strip()
                sw=set(s.split())
                score=.58*difflib.SequenceMatcher(None,nt,s).ratio()+.42*(len(tw&sw)/max(1,len(tw)))
                cand=(score,cues[i][0],cues[j][1],s)
                if b is None or score>b[0]:b=cand
            return b

          manifest=[]
          for name,vid,target in items:
            url=f"https://www.youtube.com/watch?v={vid}"
            os.chdir("work")
            for x in glob.glob(vid+"*"):
              try:os.remove(x)
              except:pass
            # Captions
            p=run(["yt-dlp",*COMMON,"--skip-download","--write-auto-subs","--write-subs",
                   "--sub-langs","en.*,en","--sub-format","vtt","-o",vid+".%(ext)s",url],check=False)
            vtts=glob.glob(vid+"*.vtt")
            if not vtts:
              # one alternate client ordering, still free/no cookies
              ALT=COMMON.copy()
              ALT[ALT.index("youtube:player_client=tv,web_safari;player_skip=webpage")]="youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage"
              p=run(["yt-dlp",*ALT,"--skip-download","--write-auto-subs","--write-subs",
                     "--sub-langs","en.*,en","--sub-format","vtt","-o",vid+".%(ext)s",url],check=False)
              vtts=glob.glob(vid+"*.vtt")
              common=ALT
            else:
              common=COMMON
            if not vtts: raise RuntimeError("No captions "+name)
            cues=parse_vtt(sorted(vtts,key=len)[0]); m=best(cues,target)
            if not m or m[0]<.27: raise RuntimeError("No quote match "+name+" "+repr(m))
            score,qs,qe,text=m; cs=max(0,qs-2);ce=qe+2;dur=ce-cs
            os.chdir("..")
            out=f"out/{name}.mp4"
            p=run(["yt-dlp",*common,"--download-sections",f"*{cs:.3f}-{ce:.3f}","--force-keyframes-at-cuts",
                   "-f","bestvideo*[height<=720]+bestaudio/best[height<=720]","--merge-output-format","mp4",
                   "-o",out,url],check=False)
            if not os.path.exists(out):
              # yt-dlp may choose .webm/mkv; normalize whichever exists.
              cands=[x for x in glob.glob(f"out/{name}.*") if x.endswith((".webm",".mkv",".mov"))]
              if not cands: raise RuntimeError("No video "+name)
              run(["ffmpeg","-y","-i",cands[0],"-c:v","libx264","-preset","fast","-crf","17","-c:a","aac","-b:a","192k",out])
            run(["ffmpeg","-v","error","-i",out,"-f","null","-"])
            probe=run(["ffprobe","-v","error","-show_entries","format=duration:stream=width,height,r_frame_rate","-of","default=nw=1",out]).stdout
            Path(f"out/{name}.txt").write_text(f"source={url}\nmatch={score:.3f}\nquote_start={qs:.3f}\nquote_end={qe:.3f}\nclip_start={cs:.3f}\nclip_end={ce:.3f}\nmatched={text}\n{probe}")
            manifest.append(dict(name=name,id=vid,source=url,score=score,quote_start=qs,quote_end=qe,clip_start=cs,clip_end=ce,matched=text))
          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          python /tmp/acquire.py

      - name: Upload source clips
        uses: actions/upload-artifact@v4
        with:
          name: bowen-media-chatter-six
          path: out/
          if-no-files-found: error
          retention-days: 3
