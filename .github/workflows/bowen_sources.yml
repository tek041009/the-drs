name: Bowen source clips

on:
  push:
    paths:
      - ".github/workflows/bowen_sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install free source tools and WARP route
        run: |
          python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider faster-whisper 'av<19'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker run -d --name bowen-warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 10
          docker ps
          yt-dlp --version

      - name: Download real video, locate quotes locally, cut exact snippets
        shell: bash
        run: |
          mkdir -p out work
          cat > /tmp/acquire.py <<'PY'
          import os,re,glob,html,difflib,subprocess,json
          from pathlib import Path
          from faster_whisper import WhisperModel

          items=[
           ("01_WEST_HAM_WAY_NOT_CONFIDENT","4fg9pR3i3Vg","I'm not confident that Jarrod Bowen stays"),
           ("02_TONY_GALE_CHAMPIONSHIP","ycmfKTfv6O4","West Ham will be able to persuade him to play for them in the Championship"),
           ("03_DARREN_BENT_CHAMPIONS_LEAGUE","zSjDwM2nmUM","Champions League football pretty much week in week out"),
           ("04_STELLING_PARLOUR_WHAT_AM_I_DOING","AYB1oR60h0U","Jarrod's got to be looking at that league table and thinking what am I doing"),
           ("05_HAMMERS_CHAT_ATTRACTIVE","TBQDPInEbEY","Would Jarrod Bowen want to go yeah I can understand that being attractive to him"),
           ("06_JAMES_CORDEN_ABSOLUTELY_SHOULD_GO","xBCcQBX9OJ0","if Liverpool come in for him or Man United come in for him he absolutely should go"),
          ]

          COMMON=[
            "--proxy","socks5://127.0.0.1:1080",
            "--force-ipv4","--rm-cache-dir",
            "--js-runtimes","node",
            "--remote-components","ejs:github",
            "--extractor-args","youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage",
            "--retries","3","--fragment-retries","3","--socket-timeout","30"
          ]

          def run(cmd,check=True):
            print("+"," ".join(cmd),flush=True)
            p=subprocess.run(cmd,text=True,capture_output=True)
            print(p.stdout); print(p.stderr)
            if check and p.returncode: raise RuntimeError("command failed")
            return p

          def norm(s):
            s=html.unescape(s)
            for a in ("Jared","Gerard","Jarrad"): s=s.replace(a,"Jarrod")
            s=s.lower().replace("'","")
            return re.sub(r"\s+"," ",re.sub(r"[^a-z0-9]+"," ",s)).strip()

          def best_segments(segs,target):
            nt=norm(target); tw=set(nt.split()); b=None
            for i in range(len(segs)):
              s=""
              for j in range(i,min(i+7,len(segs))):
                s=(s+" "+norm(segs[j]["text"])).strip()
                sw=set(s.split())
                score=.60*difflib.SequenceMatcher(None,nt,s).ratio()+.40*(len(tw&sw)/max(1,len(tw)))
                cand=(score,segs[i]["start"],segs[j]["end"],s)
                if b is None or score>b[0]: b=cand
            return b

          model=WhisperModel("tiny.en",device="cpu",compute_type="int8")
          manifest=[]
          for name,vid,target in items:
            url=f"https://www.youtube.com/watch?v={vid}"
            src=f"work/{vid}.mp4"
            # Use the real moving source. Prefer highest accessible <=720, fall back to progressive 18.
            p=run(["yt-dlp",*COMMON,
                   "-f","bestvideo*[height<=720]+bestaudio/best[height<=720]/18",
                   "--merge-output-format","mp4","-o",src,url],check=False)
            if not os.path.exists(src):
              cands=[x for x in glob.glob(f"work/{vid}.*") if x.endswith((".webm",".mkv",".mov",".mp4"))]
              if not cands: raise RuntimeError("No real video downloaded "+name)
              if cands[0]!=src:
                run(["ffmpeg","-y","-i",cands[0],"-c:v","libx264","-preset","veryfast","-crf","18","-c:a","aac","-b:a","160k",src])

            probe=run(["ffprobe","-v","error","-show_entries","format=duration:stream=width,height,r_frame_rate","-of","default=nw=1",src]).stdout
            print("SOURCE PROBE",name,probe,flush=True)

            # Local ASR is only a locator; source audio/video itself stays untouched until FFmpeg trim.
            segments,info=model.transcribe(src,beam_size=2,language="en",vad_filter=True)
            segs=[{"start":s.start,"end":s.end,"text":s.text} for s in segments]
            m=best_segments(segs,target)
            if not m or m[0]<.24:
              # Dump nearby transcript for audit before failing.
              Path(f"out/{name}_transcript.txt").write_text("\n".join(f"{x['start']:.2f}-{x['end']:.2f} {x['text']}" for x in segs))
              raise RuntimeError("No quote match "+name+" "+repr(m))
            score,qs,qe,matched=m
            cs=max(0,qs-2.0); ce=qe+2.0; dur=ce-cs
            out=f"out/{name}.mp4"
            run(["ffmpeg","-y","-ss",f"{cs:.3f}","-i",src,"-t",f"{dur:.3f}",
                 "-c:v","libx264","-preset","fast","-crf","17",
                 "-c:a","aac","-b:a","192k","-movflags","+faststart",out])
            run(["ffmpeg","-v","error","-i",out,"-f","null","-"])
            oprobe=run(["ffprobe","-v","error","-show_entries","format=duration:stream=width,height,r_frame_rate","-of","default=nw=1",out]).stdout
            Path(f"out/{name}.txt").write_text(
              f"source={url}\nmatch={score:.3f}\nquote_start={qs:.3f}\nquote_end={qe:.3f}\nclip_start={cs:.3f}\nclip_end={ce:.3f}\nmatched={matched}\nSOURCE\n{probe}\nCLIP\n{oprobe}"
            )
            Path(f"out/{name}_transcript.txt").write_text("\n".join(f"{x['start']:.2f}-{x['end']:.2f} {x['text']}" for x in segs))
            manifest.append(dict(name=name,id=vid,source=url,score=score,quote_start=qs,quote_end=qe,clip_start=cs,clip_end=ce,matched=matched))
            try: os.remove(src)
            except: pass

          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          python /tmp/acquire.py

      - name: Upload source clips
        uses: actions/upload-artifact@v4
        with:
          name: bowen-media-chatter-six
          path: out/
          if-no-files-found: error
          retention-days: 3
