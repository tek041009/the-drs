name: Bowen exact podcast clips
on:
  push:
    paths:
      - ".github/workflows/bowen_exact_podcast_clips.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          python -m pip install -q --upgrade yt-dlp faster-whisper 'av<19'
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          docker run -d --name bowen-warp -p 1080:1080 ghcr.io/kingcc/warproxy:latest
          sleep 8
      - name: Download, word-align, clip
        shell: bash
        run: |
          mkdir -p out work
          cat > /tmp/exact.py <<'PY'
          import os,re,subprocess,json,difflib
          from pathlib import Path
          from faster_whisper import WhisperModel

          items=[
            {
              "name":"01_NOT_CONFIDENT_STAYS",
              "id":"4fg9pR3i3Vg",
              "target":"im not confident that jarrod bowen stays",
              "rough_start":338.0,
              "rough_end":348.0
            },
            {
              "name":"02_PERSUADE_CHAMPIONSHIP",
              "id":"ycmfKTfv6O4",
              "target":"is there any way you think that west ham will be able to persuade him to play for them in the championship",
              "rough_start":353.0,
              "rough_end":365.0
            },
            {
              "name":"03_THINKING_CHAMPIONS_LEAGUE",
              "id":"zSjDwM2nmUM",
              "target":"but i think he will definitely think to himself i should be playing champions league football",
              "rough_start":160.0,
              "rough_end":171.0
            },
            {
              "name":"04_CORDEN_SHOULD_GO",
              "id":"xBCcQBX9OJ0",
              "target":"if liverpool come in for him or man united come in for him he absolutely should go",
              "rough_start":723.0,
              "rough_end":735.0
            },
          ]

          common=[
            "--proxy","socks5://127.0.0.1:1080",
            "--force-ipv4","--rm-cache-dir",
            "--js-runtimes","node",
            "--remote-components","ejs:github",
            "--extractor-args","youtube:player_client=tv_downgraded,web_creator,mweb;player_skip=webpage",
            "--retries","4","--fragment-retries","4","--socket-timeout","40"
          ]

          def norm(s):
            s=s.lower().replace("'","")
            s=s.replace("jared","jarrod").replace("jarrad","jarrod")
            return re.sub(r"\s+"," ",re.sub(r"[^a-z0-9]+"," ",s)).strip()

          def run(cmd):
            print("+"," ".join(cmd),flush=True)
            subprocess.run(cmd,check=True)

          model=WhisperModel("tiny.en",device="cpu",compute_type="int8")
          manifest=[]

          for it in items:
            src=f"work/{it['id']}.mp4"
            url=f"https://www.youtube.com/watch?v={it['id']}"
            run(["yt-dlp",*common,
                 "--download-sections",f"*{it['rough_start']}-{it['rough_end']}",
                 "--force-keyframes-at-cuts",
                 "-f","bestvideo*[height<=720]+bestaudio/best[height<=720]/18",
                 "--merge-output-format","mp4","-o",src,url])

            segs,_=model.transcribe(src,language="en",beam_size=3,vad_filter=False,word_timestamps=True)
            words=[]
            for s in segs:
              for w in (s.words or []):
                nw=norm(w.word)
                if nw:
                  words.append({"start":float(w.start),"end":float(w.end),"word":nw,"raw":w.word})

            target=norm(it["target"])
            best=None
            maxn=min(28,len(words))
            for i in range(len(words)):
              txt=""
              for j in range(i,min(len(words),i+maxn)):
                txt=(txt+" "+words[j]["word"]).strip()
                score=difflib.SequenceMatcher(None,target,txt).ratio()
                # reward exact target containment / same token set
                if txt==target: score+=1.0
                cand=(score,i,j,txt)
                if best is None or score>best[0]: best=cand

            score,i,j,matched=best
            # exact word edges with tiny natural handles only
            start=max(0.0,words[i]["start"]-0.06)
            end=words[j]["end"]+0.10
            dur=end-start
            out=f"out/{it['name']}.mp4"
            run(["ffmpeg","-y","-loglevel","error","-ss",f"{start:.3f}","-i",src,"-t",f"{dur:.3f}",
                 "-c:v","libx264","-preset","fast","-crf","17",
                 "-c:a","aac","-b:a","192k","-movflags","+faststart",out])
            run(["ffmpeg","-v","error","-i",out,"-f","null","-"])
            data={
              "name":it["name"],"source":url,"rough_start":it["rough_start"],
              "match_score":score,"local_start":start,"local_end":end,
              "source_start":it["rough_start"]+start,
              "source_end":it["rough_start"]+end,
              "matched":matched,
              "first_word":words[i],"last_word":words[j],
              "all_words":words
            }
            Path(f"out/{it['name']}.json").write_text(json.dumps(data,indent=2))
            manifest.append(data)

          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2))
          PY
          python /tmp/exact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bowen-exact-podcast-clips
          path: out/
          retention-days: 2
